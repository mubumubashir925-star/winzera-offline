name: Publish signed Android update
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version such as 1.0.2
        required: true
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          for v in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            test -n "${!v}" || { echo "::error::Missing signing secret $v"; exit 1; }
          done
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:prepare
        env:
          WINZERA_VERSION: ${{ inputs.version }}
      - name: Validate web JavaScript syntax
        run: node scripts/validate-web.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure native resources
        run: |
          python3 scripts/android-safe-area.py
          python3 scripts/android-native-diagnostic.py
          python3 -m pip install --quiet pillow
          python3 scripts/android-icon.py
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/configure-release.py
      - name: Verify Gradle repositories and dependencies
        working-directory: android
        run: |
          echo "Gradle repositories:"
          grep -R -n -E 'google-services|mavenCentral\(\)|google\(\)|kotlin-stdlib-jdk8' --include='*.gradle' --include='*.gradle.kts' . || true
          echo "Kotlin artifact repository HTTP status:"
          curl -IL --max-time 20 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom' || true
      - name: Build signed release
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |\n          chmod +x gradlew\n          ./gradlew assembleRelease --no-daemon --refresh-dependencies --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "winzera-v$VERSION.apk"
          gh release create "v$VERSION" "winzera-v$VERSION.apk" --target mobile-app --title "Winzera v$VERSION" --notes "Back up data before updating."
