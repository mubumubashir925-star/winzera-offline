name: One-time Android signing setup
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify required secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_BACKUP_PASSWORD }}
          SETUP_PAT: ${{ secrets.ANDROID_SETUP_PAT }}
        run: |
          for name in STORE_PASSWORD KEY_PASSWORD BACKUP_PASSWORD SETUP_PAT; do
            test -n "${!name}" || { echo "::error::Missing $name secret"; exit 1; }
          done
      - name: Generate key and securely store signing secret
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_BACKUP_PASSWORD }}
          GH_TOKEN: ${{ secrets.ANDROID_SETUP_PAT }}
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt -keystore winzera-release.jks -storetype PKCS12 -alias winzera -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Winzera, OU=Mobile, O=Winzera, L=Kerala, C=IN" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD"
          base64 -w 0 winzera-release.jks | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf %s winzera | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          printf %s "$BACKUP_PASSWORD" | openssl enc -aes-256-cbc -pbkdf2 -salt -iter 250000 -out winzera-signing-backup.jks.enc -in winzera-release.jks -pass stdin
          rm -f winzera-release.jks
          echo "Signing secrets created. Download and securely preserve the encrypted backup artifact."
      - name: Downloadable encrypted signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: winzera-encrypted-signing-backup
          path: winzera-signing-backup.jks.enc
          retention-days: 7
          if-no-files-found: error
