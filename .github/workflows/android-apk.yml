name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths-ignore: ['**/*.md']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web app
        run: npm run mobile:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Disable Android edge-to-edge overlap
        run: python3 scripts/android-safe-area.py
      - name: Apply original Winzera launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/android-icon.py
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: winzera-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
